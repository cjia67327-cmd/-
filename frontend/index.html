<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PianoFlow · 在线钢琴弹奏台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== 3D 浮动音符装饰层 ===== -->
  <div class="bg-decor" aria-hidden="true">
    <span class="note n1">♪</span>
    <span class="note n2">♫</span>
    <span class="note n3">♩</span>
    <span class="note n4">♬</span>
    <span class="note n5">♪</span>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <!-- ===== 导航栏 ===== -->
  <nav class="navbar reveal">
    <div class="nav-left">
      <div class="logo">🎹 Piano<span>Flow</span></div>
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="free">自由弹奏</button>
        <button class="mode-btn" data-mode="game">跟弹闯关</button>
      </div>
    </div>
    <div class="nav-right">
      <label class="api-label">后端地址：
        <input id="apiBase" type="text" placeholder="https://your-api.onrender.com" />
      </label>
      <span id="apiStatus" class="api-status">未连接</span>
    </div>
  </nav>

  <!-- ===== 主内容 ===== -->
  <main>

    <!-- 数据面板 -->
    <section class="stats-panel reveal">
      <div class="stat">
        <div class="stat-num" id="statScore">0</div>
        <div class="stat-label">得分</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statAccuracy">--</div>
        <div class="stat-label">正确率</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statSpeed">--</div>
        <div class="stat-label">速度 (BPM)</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statCombo">0</div>
        <div class="stat-label">连击</div>
      </div>
    </section>

    <!-- 乐谱区 -->
    <section class="sheet-section reveal">
      <div class="sheet-header">
        <h2>乐谱库</h2>
        <select id="sheetSelect"></select>
        <button id="startGameBtn" class="btn primary" disabled>开始跟弹</button>
        <button id="stopGameBtn" class="btn danger" style="display:none">停止</button>
      </div>
      <!-- 跟弹轨道：音符从右向左滚动 -->
      <div class="track" id="gameTrack" style="display:none">
        <div class="track-line"></div>
        <div class="track-notes" id="trackNotes"></div>
      </div>
      <!-- 静态乐谱可视化 -->
      <div class="sheet-visual" id="sheetVisual"></div>
    </section>

    <!-- 钢琴区 -->
    <section class="piano-section reveal">
      <div class="keyboard-hint">电脑键盘 A S D F G H J K · 黑键 W E T Y U</div>
      <div class="piano" id="piano"></div>
    </section>

    <!-- 控制面板 -->
    <section class="control-panel reveal">
      <div class="ctrl-group">
        <button id="recordBtn" class="btn record">● 开始录音</button>
        <button id="playbackBtn" class="btn" disabled>▶ 回放</button>
        <button id="pauseBtn" class="btn" disabled>⏸ 暂停</button>
        <button id="stopRecBtn" class="btn danger" disabled>■ 停止</button>
      </div>
      <div class="ctrl-group">
        <label>音量
          <input type="range" id="volume" min="0" max="100" value="70" />
        </label>
        <label>跟弹速度
          <input type="range" id="speed" min="50" max="200" value="100" />
          <span id="speedVal">100</span> BPM
        </label>
      </div>
      <div class="ctrl-group">
        <button id="saveBtn" class="btn primary" disabled>💾 保存作品</button>
      </div>
    </section>

    <!-- 作品区 -->
    <section class="works-section reveal">
      <h2>我的作品</h2>
      <div id="worksList" class="works-list">
        <p class="empty-tip">还没有作品，弹一段录下来吧～</p>
      </div>
    </section>

  </main>

  <footer class="footer reveal">
    <p>PianoFlow · Salamander 真实钢琴采样 · 前后端分离演示</p>
  </footer>

  <!-- 内置 Web Audio 合成器，无需外部依赖 -->
  <script src="js/audio.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/game.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
